.config:
  include:
    - ./tmux_local.yml
  projects_path: ~/dev
  named_layouts:
    claude:
      cwd: .
      split:
        direction: h
        child:
          cwd: .
          cmd: claude
          split:
            direction: v
            child:
              cwd: .
              clock: true

general:
  root: ~/dev

df:
  root: ~/.dotfiles
  aliases: [dotfiles]
  windows:
    - .
