# Settings shared by every platform. Imported by alacritty.toml (macOS) and
# windows.toml, which add the platform's modifier-key bindings on top.

[env]
TERM = "xterm-256color"

[window]
opacity = 0.85
# Spread extra padding evenly around the terminal content
dynamic_padding = true

[window.padding]
x = 8
y = 0

[font]
size = 14.0

[font.normal]
family = "FiraCode Nerd Font Mono"
style = "Light"

[font.bold]
family = "FiraCode Nerd Font Mono"
style = "Regular"

[font.italic]
family = "FiraCode Nerd Font Mono"
style = "Light"

# Catppuccin Mocha theme
[colors.primary]
background = "#1e1e2e"
foreground = "#cdd6f4"
dim_foreground = "#7f849c"
bright_foreground = "#cdd6f4"

[colors.cursor]
text = "#1e1e2e"
cursor = "#f5e0dc"

[colors.vi_mode_cursor]
text = "#1e1e2e"
cursor = "#b4befe"

[colors.search.matches]
foreground = "#1e1e2e"
background = "#a6adc8"

[colors.search.focused_match]
foreground = "#1e1e2e"
background = "#a6e3a1"

[colors.footer_bar]
foreground = "#1e1e2e"
background = "#a6adc8"

[colors.hints.start]
foreground = "#1e1e2e"
background = "#f9e2af"

[colors.hints.end]
foreground = "#1e1e2e"
background = "#a6adc8"

[colors.selection]
text = "#1e1e2e"
background = "#f5e0dc"

[colors.normal]
black = "#45475a"
red = "#f38ba8"
green = "#a6e3a1"
yellow = "#f9e2af"
blue = "#89b4fa"
magenta = "#f5c2e7"
cyan = "#94e2d5"
white = "#bac2de"

[colors.bright]
black = "#585b70"
red = "#f38ba8"
green = "#a6e3a1"
yellow = "#f9e2af"
blue = "#89b4fa"
magenta = "#f5c2e7"
cyan = "#94e2d5"
white = "#a6adc8"

[colors.dim]
black = "#45475a"
red = "#f38ba8"
green = "#a6e3a1"
yellow = "#f9e2af"
blue = "#89b4fa"
magenta = "#f5c2e7"
cyan = "#94e2d5"
white = "#bac2de"

[[colors.indexed_colors]]
index = 16
color = "#fab387"

[[colors.indexed_colors]]
index = 17
color = "#f5e0dc"

# ==============================================================================
# Key bindings that are the same on every platform
# ==============================================================================

# Select tmux window 1-9,0: Ctrl+1-9,0
[[keyboard.bindings]]
key = "Key1"
mods = "Control"
chars = "\u00021"

[[keyboard.bindings]]
key = "Key2"
mods = "Control"
chars = "\u00022"

[[keyboard.bindings]]
key = "Key3"
mods = "Control"
chars = "\u00023"

[[keyboard.bindings]]
key = "Key4"
mods = "Control"
chars = "\u00024"

[[keyboard.bindings]]
key = "Key5"
mods = "Control"
chars = "\u00025"

[[keyboard.bindings]]
key = "Key6"
mods = "Control"
chars = "\u00026"

[[keyboard.bindings]]
key = "Key7"
mods = "Control"
chars = "\u00027"

[[keyboard.bindings]]
key = "Key8"
mods = "Control"
chars = "\u00028"

[[keyboard.bindings]]
key = "Key9"
mods = "Control"
chars = "\u00029"

[[keyboard.bindings]]
key = "Key0"
mods = "Control"
chars = "\u00020"

# Delete previous word: Alt+Backspace
[[keyboard.bindings]]
key = "Back"
mods = "Alt"
chars = "\u0017"

# Shift+Enter sends Escape+Return
[[keyboard.bindings]]
key = "Return"
mods = "Shift"
chars = "\u001b\r"
