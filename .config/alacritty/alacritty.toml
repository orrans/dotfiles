# macOS entry point: Alacritty reads ~/.config/alacritty/alacritty.toml.
# Shared settings live in shared.toml; this file adds the macOS window options
# and the Cmd/Opt key bindings. Windows uses windows.toml instead.

[general]
import = ["shared.toml"]

[window]
decorations = "Transparent"
# Lets the Opt bindings below reach the terminal instead of typing symbols
option_as_alt = "Both"

# Mouse bindings
[[mouse.bindings]]
mouse = "Left"
mods = "Command"
action = "None"

# ==============================================================================
# Font size
# ==============================================================================

# Increase font size: Cmd+Shift+=
[[keyboard.bindings]]
key = "+"
mods = "Command|Shift"
action = "IncreaseFontSize"

# Reset font size: Cmd+Shift+0
[[keyboard.bindings]]
key = ")"
mods = "Command|Shift"
action = "ResetFontSize"

# ==============================================================================
# tmux bindings
# ==============================================================================

# Previous tmux window: Cmd+Shift+[  (which is Cmd+{)
[[keyboard.bindings]]
key = "{"
mods = "Command|Shift"
chars = "\u0002p"

# Next tmux window: Cmd+Shift+]  (which is Cmd+})
[[keyboard.bindings]]
key = "}"
mods = "Command|Shift"
chars = "\u0002n"

# Zoom tmux pane: Cmd+Z
[[keyboard.bindings]]
key = "Z"
mods = "Command"
chars = "\u0002z"

# Kill tmux pane: Cmd+W
[[keyboard.bindings]]
key = "W"
mods = "Command"
chars = "\u0002x"

# Detach tmux: Cmd+Shift+W
[[keyboard.bindings]]
key = "W"
mods = "Command|Shift"
chars = "\u0002d"

# Split tmux pane horizontally: Cmd+D
[[keyboard.bindings]]
key = "D"
mods = "Command"
chars = "\u0002|"

# Split tmux pane vertically: Cmd+Shift+D
[[keyboard.bindings]]
key = "D"
mods = "Command|Shift"
chars = "\u0002_"

# Create new tmux window: Cmd+T
[[keyboard.bindings]]
key = "T"
mods = "Command"
chars = "\u0002c"

# Set tmux split equal: Cmd+=
[[keyboard.bindings]]
key = "="
mods = "Command"
chars = "\u0002E"

# Select tmux session: Cmd+Shift+P
[[keyboard.bindings]]
key = "P"
mods = "Command|Shift"
chars = "\u0002s"

# ==============================================================================
# vim bindings
# ==============================================================================

# Split vim pane horizontally: Opt+S
[[keyboard.bindings]]
key = "S"
mods = "Alt"
chars = "\u0017s"

# Split vim pane vertically: Opt+V
[[keyboard.bindings]]
key = "V"
mods = "Alt"
chars = "\u0017v"

# Select all in nvim: Cmd+A
[[keyboard.bindings]]
key = "A"
mods = "Command"
chars = "\u001bggVG"

# Save in nvim: Cmd+S
[[keyboard.bindings]]
key = "S"
mods = "Command"
chars = "\u001b\u001b w"

# Save all in nvim: Cmd+Shift+S
[[keyboard.bindings]]
key = "S"
mods = "Command|Shift"
chars = "\u001b\u001b W"

# Save and close pane in nvim: Cmd+Opt+S
[[keyboard.bindings]]
key = "S"
mods = "Command|Alt"
chars = "\u001b\u001bZZ"

# Open file text search in neovim: Cmd+Shift+F
[[keyboard.bindings]]
key = "F"
mods = "Command|Shift"
chars = "\u001b\u001b fg\n"

# Open file picker in neovim: Cmd+P
[[keyboard.bindings]]
key = "P"
mods = "Command"
chars = "\u001b\u001b ff\n"

# Open lazygit in neovim: Cmd+G
[[keyboard.bindings]]
key = "G"
mods = "Command"
chars = "\u001b\u001b gs\n"

# ==============================================================================
# Terminal bindings
# ==============================================================================

# Delete entire row: Cmd+Backspace
[[keyboard.bindings]]
key = "Backspace"
mods = "Command"
chars = "\u0015"
